<style>
/* Layout: app shell. Faixa de protótipo, barra de topo com clínica e perfil, menu lateral, área de trabalho. */
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#EAF2F7; --ink:#0D2B4E; --ink-2:#4F6B80;
  --line:#D3E3EC; --accent:#00A8CC; --accent-ink:#006F88; --accent-soft:#DDF3F8;
  --navy:#0D2B4E; --navy-ink:#FFFFFF; --coral:#E8602C;
  --good:#1E8A5A; --good-soft:#DCF2E7; --warn:#B36B00; --warn-soft:#FBEBD0; --crit:#C23A3A; --crit-soft:#F8DEDE;
  --ear-r:#D23B3B; --ear-l:#1F6FD1;
  --font-display:'Outfit',ui-sans-serif,system-ui,sans-serif;
  --font-body:'DM Sans',ui-sans-serif,system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1726; --surface:#0F2236; --surface-2:#15304A; --ink:#E4EEF6; --ink-2:#9DB4C6;
  --line:#22405C; --accent:#2EC4E4; --accent-ink:#7FDCF0; --accent-soft:#123B4E;
  --navy:#06111D; --navy-ink:#E4EEF6; --coral:#FF8A5C;
  --good:#4CC48C; --good-soft:#123A2A; --warn:#F0B04A; --warn-soft:#3A2C12; --crit:#F07070; --crit-soft:#3E1A1C;
  --ear-r:#FF6B6B; --ear-l:#5AA2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1726; --surface:#0F2236; --surface-2:#15304A; --ink:#E4EEF6; --ink-2:#9DB4C6;
  --line:#22405C; --accent:#2EC4E4; --accent-ink:#7FDCF0; --accent-soft:#123B4E;
  --navy:#06111D; --navy-ink:#E4EEF6; --coral:#FF8A5C;
  --good:#4CC48C; --good-soft:#123A2A; --warn:#F0B04A; --warn-soft:#3A2C12; --crit:#F07070; --crit-soft:#3E1A1C;
  --ear-r:#FF6B6B; --ear-l:#5AA2FF; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
.app{min-height:100%;display:flex;flex-direction:column}
.proto{background:#C9501C;color:#fff;font-size:12.5px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.proto b{font-weight:600}
.proto button{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12px}
.top{background:var(--navy);color:var(--navy-ink);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}

.top .sp{flex:1}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px}
.ctl label{opacity:.75}
.ctl select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 8px;color:var(--navy-ink);max-width:220px}
.ctl select option{color:#0D2B4E;background:#fff}
.body{flex:1;display:flex;min-height:0}

nav.side button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}

main{flex:1;min-width:0;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.wrap{max-width:1120px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04202A;font-weight:600}

.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .hd h2{font-size:15px;font-weight:600}
.card .hd .note{color:var(--ink-2);font-size:12px}
.card .hd .r{margin-left:auto;display:flex;gap:6px}
.card .bd{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.stat:hover{border-color:var(--accent)}
.stat .v{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.1}

.stat.warn .v{color:var(--warn)} .stat.crit .v{color:var(--crit)}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}

tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.tbl{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.cl{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-2);white-space:nowrap}
.muted{color:var(--ink-2)} .small{font-size:12.5px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}

.li .m b{font-weight:600}
.empty{color:var(--ink-2);padding:12px 0;font-size:13px}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.ag{overflow-x:auto}
.agi{display:grid;min-width:520px}
.ag-h{font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;position:sticky;top:0;background:var(--surface)}

.ag-times div{height:44px;font-size:11px;color:var(--ink-2);text-align:right;padding-right:8px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.ag-col{position:relative;border-left:1px solid var(--line)}
.slot{height:22px;border-bottom:1px dashed transparent;cursor:pointer}
.slot.h{border-bottom:1px solid var(--line)}
.slot.half{border-bottom:1px dashed var(--line)}
.slot:hover{background:var(--accent-soft)}
.slot.lunch{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);cursor:default}
.appt{position:absolute;left:4px;right:4px;border-radius:7px;padding:4px 8px;font-size:12px;line-height:1.25;cursor:pointer;overflow:hidden;border:1px solid var(--accent);background:var(--accent-soft);text-align:left}
.appt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt span{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.appt.st-chegou{border-color:var(--good);background:var(--good-soft)}
.appt.st-concluida{border-color:var(--line);background:var(--surface-2);opacity:.75}
.appt.st-faltou{border-color:var(--crit);background:var(--crit-soft)}
.appt.st-marcada{border-style:dashed}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--accent);background:var(--accent-soft)}
/* Ficha */
.pt-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:18px;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:13.5px;align-content:start}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.audio-svg{width:100%;height:auto;display:block}
.thr{font-size:12.5px}
.thr th,.thr td{padding:5px 6px;text-align:center}
.thr input{width:52px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 4px;text-align:center;font-variant-numeric:tabular-nums}
.thr input:disabled{background:transparent;border-color:transparent}
.ear-r{color:var(--ear-r);font-weight:600} .ear-l{color:var(--ear-l);font-weight:600}
.att{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.att .ic{width:34px;height:40px;border-radius:5px;background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink-2);flex:none;overflow:hidden}
.att .ic img{width:100%;height:100%;object-fit:cover}
.att .m{flex:1;min-width:0}
.att .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{border:1.5px dashed var(--accent);border-radius:8px;padding:16px;text-align:center;color:var(--ink-2);cursor:pointer;display:block}
.drop.over{background:var(--accent-soft)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.pending{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:8px;padding:10px}
.pending select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface)}
.plan{list-style:none;margin:0;padding:0 0 0 18px;position:relative}
.plan:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.plan li{position:relative;padding:6px 0 10px}
.plan li:before{content:"";position:absolute;left:-18px;top:10px;width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--surface)}
.plan li.done:before{background:var(--accent)}
.plan li.late:before{border-color:var(--crit)}
.plan li .d{font-weight:600;font-variant-numeric:tabular-nums}
.dev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.hist .li .t{width:84px;font-weight:500;color:var(--ink-2)}
/* Audiograma */
.au-lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:700;margin:4px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 120px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ear-r);border-color:var(--ear-r);color:#fff}
.seg button.oe[aria-pressed="true"]{background:var(--ear-l);border-color:var(--ear-l)}
.seg.aasi button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#04202A}
.au-side{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.au-side>span{font-size:12px;font-weight:600;color:var(--ink-2)}
.au-side .seg{flex:1}
.stack{display:flex;flex-direction:column;gap:18px}
.au-ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.au-ctl{grid-template-columns:minmax(0,1fr)}}
.ag-wrap{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;justify-content:center}
.ag-ear{flex:1 1 300px;min-width:0;max-width:560px}
.ag-title{text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:5px}
.ag-svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ag-hit{cursor:crosshair}
.ag-tools{display:flex;gap:4px;justify-content:center;margin-top:6px}

.ag-tools button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.ag-stats{display:flex;gap:6px;margin-top:6px}

.ag-stats span{font-size:11px;color:var(--ink-2)}
.g-good{color:var(--good)} .g-acc{color:var(--accent-ink)} .g-warn{color:var(--warn)} .g-crit{color:var(--crit)}
.au-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(5,15,28,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));z-index:50;overflow-y:auto}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mod .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.mod .hd h2{font-size:17px;font-weight:600}
.mod .hd button{margin-left:auto}
.mod .bd{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mod .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--ink-2);font-weight:500}
.f input,.f select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.check input{width:auto}
.hint{font-size:12px;color:var(--ink-2)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12.5px}
.stbtns{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.big{max-width:100%;border-radius:8px;display:block;margin:0 auto}
@media (max-width:900px){.grid2,.dev{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:minmax(0,1fr)}}

  .body{flex-direction:column}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function freeSlots(prof,date,dur,ignore){
  var out=[];for(var m=540;m+dur<=1140;m+=30){if(m<840&&m+dur>780)continue;var busy=D.appts.some(function(a){return a.id!==ignore&&a.prof===prof&&a.date===date&&a.status!=='faltou'&&tm(a.time)<m+dur&&tm(a.time)+a.dur>m;});if(!busy)out.push(mt(m));}return out;
}

  h+='<div class="body"><nav class="side" aria-label="Menu">'+NAV.filter(function(n){return n[0]!=='equipa'||u.role==='gestor';}).map(function(n){var cur=S.view===n[0]||(n[0]==='pacientes'&&S.view==='ficha');return '<button data-a="nav" data-v="'+n[0]+'" aria-current="'+cur+'">'+n[1]+(n[0]==='posvenda'&&pend?'<span class="n tnum">'+pend+'</span>':'')+'</button>';}).join('')+'<div class="who"><b>'+esc(u.name)+'</b><br>'+ROLES[u.role]+'<br>'+(u.role==='gestor'?'Todas as clínicas':u.clinics.map(function(c){return C(c).short;}).join(', '))+'</div></nav>';
  h+='<main><div class="wrap">';
  h+=({inicio:vInicio,agenda:vAgenda,pacientes:vPacientes,ficha:vFicha,posvenda:vPosvenda,equipa:vEquipa}[S.view]||vInicio)();
  h+='</div></main></div>';
  if(S.modal){var mm={appt:mAppt,apptView:mApptView,patient:mPatient,device:mDevice,assist:mAssist,invite:mInvite,att:mAtt}[S.modal.k];h+='<div class="ov" data-a="ov"><div class="mod" role="dialog" aria-modal="true">'+mm()+'</div></div>';}
  if(S.toast)h+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
  var app=document.getElementById('app');var y=window.scrollY;app.innerHTML=h;window.scrollTo(0,y);
  bindDrop();
}
var tt;function toast(s){S.toast=s;clearTimeout(tt);tt=setTimeout(function(){S.toast=null;render();},2800);}

function openAppt(o){
  o=o||{};var cs=allowed();var c=o.clinic||(S.clinic==='all'?(S.view==='agenda'?S.agClinic:cs[0]):S.clinic);
  if(o.patient&&!o.clinic){var p=Pt(o.patient);if(cs.indexOf(p.clinic)>=0&&S.clinic==='all')c=p.clinic;}
  var u=me();
  S.modal={k:'appt',patient:o.patient||'',type:o.type||'aval',clinic:c,prof:o.prof||(u.role==='audio'&&u.clinics.indexOf(c)>=0?u.id:''),date:o.date||(S.view==='agenda'?S.date:TODAY),time:o.time||'',planRef:o.planRef||null};
  render();
}
function readAppt(){var m=S.modal;var g=function(id){var e=document.getElementById(id);return e?e.value:'';};m.patient=g('m-p');m.type=g('m-ty');m.clinic=g('m-c');m.prof=g('m-pr');m.date=g('m-d')||TODAY;m.time=g('m-t');}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a'),ds=el.dataset;
  if(a==='ov'){if(ev.target===el){S.modal=null;render();}return;}
  if(a==='nav'){S.view=ds.v;S.modal=null;if(ds.v==='agenda')S.date=TODAY;render();window.scrollTo(0,0);}
  else if(a==='pick-clinic'){S.clinic=ds.c;render();}
  else if(a==='open-patient'){S.patient=ds.id;S.view='ficha';S.tab='resumo';S.examSel=null;S.pending=null;S.modal=null;render();window.scrollTo(0,0);}
  else if(a==='open-dev'){S.patient=ds.id;S.view='ficha';S.tab='aparelhos';S.modal=null;render();window.scrollTo(0,0);}
  else if(a==='tab'){S.tab=ds.t;S.pending=null;render();}
  else if(a==='close'){S.modal=null;render();}
  else if(a==='reset'){D=seed();S={view:'inicio',clinic:'all',user:'u1',patient:null,tab:'resumo',date:TODAY,agClinic:'cacem',search:'',modal:null,examSel:null,compare:true,pending:null,equipaTab:'users'};toast('Dados de demonstração repostos.');render();}
  else if(a==='new-appt'){openAppt({patient:ds.p,type:ds.ty});}
  else if(a==='slot'){openAppt({prof:ds.p,time:ds.t,clinic:S.agClinic,date:S.date});}
  else if(a==='appt'){S.modal={k:'apptView',id:ds.id};render();}
  else if(a==='set-status'){var ap=D.appts.find(function(x){return x.id===ds.id;});ap.status=ds.s;
    D.devices.forEach(function(d){d.plan.forEach(function(it){if(it.appt===ap.id){it.status=ds.s==='concluida'?'concluida':ds.s==='faltou'?'por marcar':'marcada';if(ds.s==='faltou')it.appt=null;}});});
    toast('Estado alterado para '+STATUS[ds.s]+'.');render();}
  else if(a==='new-patient'){S.modal={k:'patient'};render();}
  else if(a==='new-patient-from-appt'){readAppt();S.back=S.modal;S.modal={k:'patient'};render();}
  else if(a==='day'){var n=+ds.n;S.date=n===0?TODAY:addD(S.date,n);render();}
  else if(a==='ag-clinic'){S.agClinic=ds.c;render();}
  else if(a==='new-audio'){var p=Pt(S.patient),ex=examsOf(p.id);var existing=ex.find(function(e){return e.date===TODAY;});if(existing){S.examSel=existing.id;toast('Já existe uma audiometria de hoje, aberta para edição.');render();return;}
    var last=ex[0];var u=me();var e={id:uid('e'),patient:p.id,date:TODAY,type:'Audiometria tonal',by:u.id,clinic:S.clinic==='all'?p.clinic:S.clinic,loss:last?last.loss:'bilateral',side:last?last.side:'OD',aasi:last?last.aasi:'retro',data:{OD:{VA:{},VO:{}},OE:{VA:{},VO:{}}}};D.exams.push(e);S.examSel=e.id;S.auHist=[];S.auType={OD:'VA',OE:'VA'};toast('Nova audiometria de hoje. Clique no gráfico para marcar os limiares.');render();}
  else if(a==='att-save'){var t=document.getElementById('attType').value;var p2=Pt(S.patient);D.atts.push({id:uid('f'),patient:p2.id,name:S.pending.name,type:t,date:TODAY,by:S.user,clinic:S.clinic==='all'?p2.clinic:S.clinic,url:S.pending.url});S.pending=null;toast('Documento anexado à ficha.');render();}
  else if(a==='att-cancel'){S.pending=null;render();}
  else if(a==='view-att'){S.modal={k:'att',id:ds.id};render();}
  else if(a==='new-dev'){S.modal={k:'device'};render();}
  else if(a==='dev-assist'){S.modal={k:'assist',id:ds.id};render();}
  else if(a==='dev-return'){var d=D.devices.find(function(x){return x.id===ds.id;});d.status='ativo';d.events.push({date:TODAY,text:'Regressou da assistência ('+d.assist.reason+')'});d.assist=null;toast('Regresso registado. O aparelho volta a "Em uso".');render();}
  else if(a==='plan-book'){var d2=D.devices.find(function(x){return x.id===ds.d;});var it=d2.plan[+ds.i];var pp=Pt(d2.patient);openAppt({patient:pp.id,type:'rev',clinic:allowed().indexOf(pp.clinic)>=0?pp.clinic:allowed()[0],date:it.date>TODAY?it.date:TODAY,planRef:{d:d2.id,i:+ds.i}});}
  else if(a==='au-loss'||a==='au-side'||a==='au-aasi'){var e=curExam();e[{'au-loss':'loss','au-side':'side','au-aasi':'aasi'}[a]]=ds.v;renderAudio();}
  else if(a==='au-type'){S.auType=S.auType||{OD:'VA',OE:'VA'};S.auType[ds.ear]=ds.v;renderAudio();}
  else if(a==='au-undo'){var e=curExam();S.auHist=S.auHist||[];for(var k=S.auHist.length-1;k>=0;k--){var hh=S.auHist[k];if(hh.ex===e.id&&hh.ear===ds.ear){if(hh.prev==null)delete e.data[hh.ear][hh.type][hh.f];else e.data[hh.ear][hh.type][hh.f]=hh.prev;S.auHist.splice(k,1);break;}}renderAudio();}
  else if(a==='au-clear'){var e=curExam();e.data[ds.ear]={VA:{},VO:{}};S.auHist=(S.auHist||[]).filter(function(x){return !(x.ex===e.id&&x.ear===ds.ear);});renderAudio();}
  else if(a==='au-plot'){var e=curExam(),hit=auHit(ev,el);if(!hit)return;var ty=(S.auType&&S.auType[ds.ear])||'VA';S.auHist=S.auHist||[];S.auHist.push({ex:e.id,ear:ds.ear,type:ty,f:hit.f,prev:e.data[ds.ear][ty][hit.f]});e.data[ds.ear][ty][hit.f]=hit.db;renderAudio();}
  else if(a==='invite'){S.modal={k:'invite'};render();}
  else if(a==='eq-tab'){S.equipaTab=ds.t;render();}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='clinicSel'){S.clinic=t.value;if(S.clinic!=='all')S.agClinic=S.clinic;render();}
  else if(t.id==='userSel'){S.user=t.value;var u=me();S.clinic=u.role==='gestor'?'all':u.clinics[0];S.agClinic=S.clinic==='all'?'cacem':S.clinic;S.modal=null;toast('A ver como '+u.name+' ('+ROLES[u.role]+').');render();}
  else if(t.id==='examSel'){S.examSel=t.value;S.auHist=[];render();}
  else if(t.id==='cmp'){S.compare=t.checked;render();}
  else if(S.modal&&S.modal.k==='appt'&&/^m-(ty|c|pr|d)$/.test(t.id)){readAppt();render();}
  else if(t.id==='fileIn'&&t.files&&t.files[0]){takeFile(t.files[0]);}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='q'){S.search=t.value;var pos=t.selectionStart;render();var q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.modal){S.modal=null;render();}});
document.addEventListener('submit',function(ev){
  ev.preventDefault();var f=ev.target.getAttribute('data-form');var g=function(id){var e=document.getElementById(id);return e?e.value.trim():'';};
  if(f==='appt'){readAppt();var m=S.modal;if(!m.patient||!m.prof||!m.time){toast('Escolha o paciente, o profissional e uma hora livre.');return;}
    var ap={id:uid('a'),patient:m.patient,clinic:m.clinic,prof:m.prof,date:m.date,time:m.time,dur:TYPES[m.type].d,type:m.type,status:'marcada',reminder:document.getElementById('m-r').checked};D.appts.push(ap);
    if(m.planRef){var d=D.devices.find(function(x){return x.id===m.planRef.d;});d.plan[m.planRef.i].status='marcada';d.plan[m.planRef.i].appt=ap.id;}
    S.modal=null;toast('Marcado: '+Pt(ap.patient).name+', '+F(ap.date)+' às '+ap.time+(ap.reminder?'. Lembrete 24 horas antes.':'.'));render();}
  else if(f==='patient'){
    if(!document.getElementById('n-rgpd').checked){toast('Falta o consentimento RGPD assinado. Sem ele não se guarda o paciente.');return;}
    var p={id:uid('p'),name:g('n-name'),birth:g('n-b'),nif:g('n-nif')||'(sem NIF)',phone:g('n-ph'),email:g('n-em')||'(sem email)',sns:g('n-sns')||'(sem n.º)',sub:g('n-sub'),subNum:g('n-subn'),clinic:g('n-c'),origin:g('n-o'),rgpd:true,created:TODAY};
    D.patients.push(p);
    if(S.back){S.modal=S.back;S.back=null;S.modal.patient=p.id;toast('Paciente registado. Continue a marcação.');render();return;}
    S.modal=null;S.patient=p.id;S.view='ficha';S.tab='resumo';toast('Paciente registado. Já está visível nas três clínicas.');render();window.scrollTo(0,0);}
  else if(f==='device'){var pt=Pt(S.patient);var fit=g('v-f')||TODAY;var w=addM(fit,12*+g('v-w'));
    var dv={id:uid('d'),patient:pt.id,brand:g('v-b'),model:g('v-m'),ear:g('v-e'),serials:g('v-s'),fitted:fit,wEnd:w,clinic:S.clinic==='all'?pt.clinic:S.clinic,status:'ativo',assist:null,plan:makePlan(fit,w),events:[{date:fit,text:'Adaptação de '+g('v-b')+' '+g('v-m')}]};
    D.devices.push(dv);S.modal=null;S.tab='aparelhos';toast('Aparelho registado. Plano criado com '+(dv.plan.length-1)+' revisões e aviso de fim de garantia.');render();}
  else if(f==='assist'){var d3=D.devices.find(function(x){return x.id===S.modal.id;});d3.status='assistencia';d3.assist={date:g('s-d')||TODAY,reason:g('s-r')};d3.events.push({date:d3.assist.date,text:'Enviado para assistência: '+d3.assist.reason});S.modal=null;toast('Enviado para assistência. Aparece no Pós-venda até regressar.');render();}
  else if(f==='invite'){var cs=[].slice.call(document.querySelectorAll('input[name="i-c"]:checked')).map(function(x){return x.value;});var r=g('i-r');if(r!=='gestor'&&!cs.length){toast('Escolha pelo menos uma clínica.');return;}
    D.users.push({id:uid('u'),name:g('i-n'),role:r,clinics:r==='gestor'?D.clinics.map(function(c){return c.id;}):cs,email:g('i-e'),st:'Convite enviado'});S.modal=null;S.equipaTab='users';toast('Convite enviado para '+g('i-e')+'.');render();}
});
function auHit(ev,rect){
  var svg=rect.ownerSVGElement,b=svg.getBoundingClientRect();
  var x=(ev.clientX-b.left)*AG.W/b.width,y=(ev.clientY-b.top)*AG.H/b.height;
  var step=(AG.r-AG.l)/(AF.length-1),fi=Math.round((x-AG.l)/step);
  if(fi<0||fi>=AF.length||Math.abs(x-ax(fi))>step*0.6)return null;
  var db=Math.round(((y-AG.t)/(AG.b-AG.t)*130-10)/5)*5;db=Math.max(-10,Math.min(120,db));
  return {fi:fi,f:AF[fi],db:db};
}
document.addEventListener('mousemove',function(ev){
  var t=ev.target;if(!(t.classList&&t.classList.contains('ag-hit')))return;
  var h=auHit(ev,t),g=t.ownerSVGElement.querySelector('.ag-guide');if(!g)return;
  if(!h){g.innerHTML='';return;}
  var c=t.dataset.ear==='OD'?'var(--ear-r)':'var(--ear-l)',x=ax(h.fi),y=ay(h.db),lab=AFL[h.fi]+' Hz · '+h.db+' dB',tx=x+8,ty=y-10;if(tx+80>AG.W)tx=x-88;if(ty<16)ty=y+18;
  g.innerHTML='<line x1="'+x+'" x2="'+x+'" y1="'+AG.t+'" y2="'+AG.b+'" stroke="'+c+'" stroke-width="0.7" stroke-dasharray="3 2" opacity="0.6"/><line x1="'+AG.l+'" x2="'+AG.r+'" y1="'+y+'" y2="'+y+'" stroke="'+c+'" stroke-width="0.7" stroke-dasharray="3 2" opacity="0.6"/><circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+c+'" opacity="0.35"/><rect x="'+(tx-4)+'" y="'+(ty-10)+'" width="80" height="14" rx="3" fill="var(--navy)" opacity="0.92"/><text x="'+tx+'" y="'+ty+'" font-size="8.5" font-weight="600" fill="var(--navy-ink)">'+lab+'</text>';
});
document.addEventListener('mouseout',function(ev){var t=ev.target;if(t.classList&&t.classList.contains('ag-hit')){var g=t.ownerSVGElement.querySelector('.ag-guide');if(g)g.innerHTML='';}});
function takeFile(file){
  if(!/\.(pdf|png|jpe?g)$/i.test(file.name)){toast('Use um PDF, JPG ou PNG.');return;}
  var url=null;try{url=URL.createObjectURL(file);}catch(e){}
  S.pending={name:file.name,url:url};render();
}
function bindDrop(){
  var d=document.getElementById('drop');if(!d)return;
  ['dragenter','dragover'].forEach(function(n){d.addEventListener(n,function(e){e.preventDefault();d.classList.add('over');});});
  ['dragleave','drop'].forEach(function(n){d.addEventListener(n,function(e){e.preventDefault();d.classList.remove('over');});});
  d.addEventListener('drop',function(e){var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)takeFile(f);});
}
render();
})();
